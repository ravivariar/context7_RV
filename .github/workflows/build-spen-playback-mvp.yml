name: Build S Pen Playback MVP

on:
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-apk:
    if: startsWith(github.head_ref, 'chatgpt/spen-playback-mvp')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: spen-playback-debug-keystore-v1
      - name: Build APK
        working-directory: spen-v02
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: spen-playback-mvp-0.2-pages-apk
          path: spen-v02/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
